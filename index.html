<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aye - this is me</title>
  <meta name="description" content="Aye (ay3x, ayeistic, hatsauce, keylows). Links to YouTube, Discord, osu!, MyAnimeList, Minecraft, Roblox, and Toram Online.">
  <meta name="theme-color" content="#17141b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aye - this is me">
  <meta property="og:description" content="I just want to enjoy my life without any trouble and push for greatness.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">

    <header class="top">
      <p class="views" id="views" title="Views" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="view-count">0</span><span class="sr">views</span>
      </p>
      <h1>Aye</h1>
      <p class="aka"><span>ay3x</span><span>ayeistic</span><span>hatsauce</span><span>keylows</span></p>
      <p class="bio">I just want to enjoy my life without any trouble and push for greatness.</p>
    </header>

    <nav aria-label="Links">

      <!-- Socials -->
      <section class="dd open ovf">
        <button class="dd-head" id="head-socials" aria-expanded="true" aria-controls="body-socials">
          <span>Socials</span><em>3</em>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="dd-body" id="body-socials" role="region" aria-labelledby="head-socials">
          <div class="dd-in">
            <div class="bars">
              <a class="bar main" href="https://www.youtube.com/@keylows_" target="_blank" rel="noopener noreferrer">
                <span class="mono">YT</span>
                <span class="text"><strong>YouTube</strong><span class="sub">@keylows_</span></span>
                <span class="art-panel"><img src="assets/youtube.webp" alt="" decoding="async"></span>
              </a>
              <a class="bar" href="https://myanimelist.net/profile/keylowss" target="_blank" rel="noopener noreferrer">
                <span class="mono">MAL</span>
                <span class="text"><strong>MyAnimeList</strong><span class="sub">keylowss</span></span>
                <span class="art-panel"><img src="assets/mal.webp" alt="" decoding="async"></span>
              </a>
              <button class="bar" type="button" data-copy="ayeistic">
                <span class="mono">DC</span>
                <span class="text"><strong>Discord</strong><span class="sub">ayeistic</span></span>
                <span class="art-panel"><img src="assets/discord.webp" alt="" decoding="async"></span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Games -->
      <section class="dd">
        <button class="dd-head" id="head-games" aria-expanded="false" aria-controls="body-games">
          <span>Games</span><em>6</em>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="dd-body" id="body-games" role="region" aria-labelledby="head-games">
          <div class="dd-in">
            <div class="bars">
              <a class="bar" href="https://osu.ppy.sh/users/16844767" target="_blank" rel="noopener noreferrer">
                <span class="mono">osu</span>
                <span class="text"><strong>osu!</strong><span class="sub">xay3</span></span>
                <span class="art-panel art-panel--small art-panel--clear art-panel--off"><img src="assets/osu.webp" alt="" decoding="async"></span>
              </a>
              <a class="bar" href="https://www.roblox.com/users/241377748/profile" target="_blank" rel="noopener noreferrer">
                <span class="mono">RB</span>
                <span class="text"><strong>Roblox</strong><span class="sub">AyePlayz</span></span>
                <img class="art" src="assets/roblox.webp" alt="" decoding="async">
              </a>
              <button class="bar" type="button" data-copy="ayeistic">
                <span class="mono">MC</span>
                <span class="text"><strong>Minecraft</strong><span class="sub">ayeistic (Xbox account)</span></span>
                <img class="art art--pixel" src="assets/minecraft.png" alt="" decoding="async">
              </button>
              <button class="bar" type="button" data-copy="アイさん">
                <span class="mono">TO</span>
                <span class="text"><strong>Toram Online</strong><span class="sub">アイさん</span><span class="note">known as ayeeehowo!</span></span>
                <img class="art" src="assets/toram.webp" alt="" decoding="async">
              </button>
              <button class="bar" type="button" data-copy="47922368">
                <span class="mono">ML</span>
                <span class="text"><strong>Mobile Legends</strong><span class="sub">ai</span></span>
                <img class="art" src="assets/mobile-legends.webp" alt="" decoding="async">
              </button>
              <!-- Shows "hatsauce" but copies the in-game ID -->
              <button class="bar" type="button" data-copy="YDEWNP92">
                <span class="mono">HD</span>
                <span class="text"><strong>Hololive Dreams</strong><span class="sub">hatsauce?</span></span>
                <span class="art-panel art-panel--small"><img src="assets/hololive-dreams.webp" alt="" decoding="async"></span>
              </button>
            </div>
          </div>
        </div>
      </section>

    </nav>

    <p class="hint">Tap a bar without a link to copy the name or ID.</p>
    <p class="credit">Art by <b>@soomz</b></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
